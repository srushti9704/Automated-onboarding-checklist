<!DOCTYPE html>
<html>
<head>
<title>Employee Task Management</title>
<style>
body{font-family:Arial; padding:20px; background:#f4f4f4}
.card{background:white; padding:20px; border-radius:8px; margin-bottom:20px}
input,button{padding:8px; margin:5px}
button{background:#007bff; color:white; border:none; border-radius:4px; cursor:pointer}
table{width:100%; border-collapse:collapse; background:white}
th,td{border:1px solid #ddd; padding:8px}
th{background:#007bff; color:white}
</style>
</head>
<body>
<h2>Employee Task Management System</h2>

<div class="card">
<h3>Add Employee</h3>
<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="dept" placeholder="Department">
<input id="role" placeholder="Role">
<button onclick="addEmployee()">Add Employee</button>
</div>

<div class="card">
<h3>Employee List</h3>
<table id="empTable"><tr><th>ID</th><th>Name</th><th>Email</th><th>Dept</th><th>Role</th></tr></table>
</div>

<script>
async function loadEmployees(){
  const res = await fetch('/api/employees');
  const data = await res.json();
  const table = document.getElementById('empTable');
  table.innerHTML = '<tr><th>ID</th><th>Name</th><th>Email</th><th>Dept</th><th>Role</th></tr>';
  data.forEach(e=>{
    table.innerHTML += `<tr><td>${e.id}</td><td>${e.name}</td><td>${e.email}</td><td>${e.department}</td><td>${e.role}</td></tr>`;
  });
}

async function addEmployee(){
  const body = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    department: document.getElementById('dept').value,
    role: document.getElementById('role').value
  };
  const res = await fetch('/api/employees',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const result = await res.json();
  if(res.ok){
    alert('Added!');
    loadEmployees();
  } else {
    alert('Error: ' + result.error);
  }
}
loadEmployees();
</script>
</body>
</html>
